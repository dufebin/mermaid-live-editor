name: Tests

on:
  pull_request:
    branches:
      - master
      - develop
  merge_group:

jobs:
  playwright:
    name: 'Playwright Tests'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: pnpm-and-build-cache
        with:
          path: |
            build
            node_modules
          key: ${{ runner.os }}-node_modules-build-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-build-

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      # NOTE: local-only suite — this e2e run requires the Go storage server
      # (build with `make -C server-go build`, then run the binary serving
      # /api on port 18790 — see README-LOCAL), which this workflow does NOT
      # provision. The storage-dependent specs (auth, save/dashboard, ...) fail
      # here; run Playwright locally per README-LOCAL instead
      # (`pnpm test:e2e:auth` spins its own isolated backend, `pnpm test:e2e`
      # reuses the resident 3000/18790 stack).
      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 7
