version: '3.7'
services:
  mermaid:
    build:
      context: .
      target: mermaid-dev
    volumes:
      - ./src:/app/src
    ports:
      - 3000:3000
      - 24678:24678
  api:
    build:
      context: .
      target: storage-api
    volumes:
      - ./server-data:/app/server-data
    ports:
      - 127.0.0.1:18790:18790
